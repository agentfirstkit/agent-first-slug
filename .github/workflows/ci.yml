name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The runner images ship whatever ShellCheck their distribution packages
      # — Ubuntu 24.04's is 0.9.0, two majors behind — and its rules differ from
      # the pinned one's on real code. Provision the pin so this leg judges the
      # tree by the same rules the local gate does.
      - name: Setup ShellCheck
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/install-shellcheck.sh --install

      # This spore has no shell scripts today, so the check reports that and
      # passes. It is here for the day one appears: the monorepo gate would
      # catch it, but this repository publishes on its own and would not.
      - name: ShellCheck
        shell: bash
        run: ./scripts/install-shellcheck.sh --check .

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit
        run: cargo test --lib --tests

      # This crate's examples live in doc comments (the README is the crate doc);
      # gate them so they cannot rot.
      - name: Doc
        run: cargo test --doc
