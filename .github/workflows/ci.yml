name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The runner images ship whatever ShellCheck their distribution packages
      # — Ubuntu 24.04's is 0.9.0, two majors behind — and its rules differ from
      # the pinned one's on real code. Provision the pin so this leg judges the
      # tree by the same rules the local gate does.
      - name: Setup ShellCheck
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/install-shellcheck.sh --install

      # Check the installer and release scripts in scripts/ for this standalone repository.
      - name: ShellCheck
        shell: bash
        run: ./scripts/install-shellcheck.sh --check .

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Unit
        run: cargo test --lib --tests

      - name: Unit without default features
        run: cargo test --no-default-features

      # This crate's examples live in doc comments (the README is the crate doc);
      # gate them so they cannot rot.
      - name: Doc
        run: cargo test --doc

  # This spore ships a Windows binary in every release and, until now, tested it
  # in none of them: the gate here is Linux and the only Windows leg lives in
  # release.yml, which does not start until a tag does. Building what the release
  # builds and running the suites that do not need a Unix host is what a push can
  # answer for; anything Unix-only stays where it is.
  windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build what the release builds
        run: cargo build --release

      - name: Unit suites
        run: cargo test --lib --tests

      - name: Unit suites without default features
        run: cargo test --no-default-features
