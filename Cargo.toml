[package]
name = "agent-first-slug"
version = "0.9.2"
edition = "2024"
rust-version = "1.100"
description = "Rust slug generation with explicit caller configuration for path and URL path segments."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-slug"
readme = "README.md"
include = [
    "src/**",
    "tests/**",
    "skills/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "clippy.toml",
]

[[bin]]
name = "afslug"
path = "src/bin/afslug.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:agent-first-data", "dep:serde_json"]

[dependencies]
agent-first-data = { version = "0.38.1", default-features = false, features = ["cli", "skill-admin"], optional = true }
serde_json = { version = "1", optional = true }
unicode-general-category = "1.1"

[lints.clippy]
uninlined_format_args = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
